<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css"></link>
</head>
<body>
    <div style="padding-bottom: 100px;">
        <form>
        <h2 id="heading" style="color: red;">Temparature Conversion</h2>
        <input type="number" id="inputlabel" value="0"><br><br>
        <input type="radio" id="toFH" name="opt">
        <label for="toFH" >Celcius ➡️ Fahrenheit </label><br><br>
        <input type="radio" id="toCS" name="opt">
        <label for="toCS" >Fahrenheit ➡️ Celcius </label><br><br>
        <button id="submitbtn" style="padding: 8px; background-color: white;" type="button" onclick=conversion()>Submit</button>
        <h3 id="resultlabel">Select one to convert</h3>
    </form>
    </div>
    
    <script src="index.js"></script>
</body>
</html>
